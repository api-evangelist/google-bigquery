apis:
- aid: google-bigquery:bigquery-connection
  name: BigQuery Connection API
  description: >-
    The BigQuery Connection API enables developers to create and manage connections between BigQuery and
    external data sources such as Cloud SQL, Cloud Spanner, and other databases. These connections allow
    BigQuery to query data in external sources without moving or copying data. The API supports creating,
    updating, deleting, and listing connections as well as managing IAM policies on connections.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://cloud.google.com/bigquery/docs/reference/bigqueryconnection/rest
  baseURL: https://bigqueryconnection.googleapis.com
  tags:
  - Connections
  - External Data
  - Federation
  properties:
  - type: Documentation
    url: https://cloud.google.com/bigquery/docs/reference/bigqueryconnection/rest
- aid: google-bigquery:bigquery-migration
  name: BigQuery Migration API
  description: >-
    The BigQuery Migration API provides tools for migrating data warehouse workloads to BigQuery from
    other platforms. It supports assessment and planning of migration tasks, translation of SQL dialects,
    and orchestration of migration workflows. The API helps enterprises move their analytics workloads
    to BigQuery with automated tooling and migration tracking.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://cloud.google.com/bigquery/docs/reference/migration/rest
  baseURL: https://bigquerymigration.googleapis.com
  tags:
  - Data Migration
  - Migration
  - SQL Translation
  properties:
  - type: Documentation
    url: https://cloud.google.com/bigquery/docs/reference/migration/rest
- aid: google-bigquery:bigquery-reservation
  name: BigQuery Reservation API
  description: >-
    The BigQuery Reservation API allows developers to manage slot reservations and capacity commitments
    for BigQuery compute resources. It provides programmatic control over how compute capacity is allocated
    across projects and organizations, enabling cost optimization and workload management. The API supports
    creating reservations, managing assignments, and purchasing capacity commitments.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://cloud.google.com/bigquery/docs/reference/reservations/rest
  baseURL: https://bigqueryreservation.googleapis.com
  tags:
  - Capacity
  - Compute
  - Reservations
  properties:
  - type: Documentation
    url: https://cloud.google.com/bigquery/docs/reference/reservations/rest
- aid: google-bigquery:bigquery-storage
  name: BigQuery Storage API
  description: >-
    The BigQuery Storage API provides high-throughput read and write access to BigQuery managed storage.
    It enables developers to read data from BigQuery tables using an efficient streaming protocol that
    is significantly faster than the traditional tabledata.list method. The API supports parallel reads,
    column filtering, and row filtering to optimize data transfer performance.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://cloud.google.com/bigquery/docs/reference/storage
  baseURL: https://bigquerystorage.googleapis.com
  tags:
  - High Throughput
  - Storage
  - Streaming
  properties:
  - type: Documentation
    url: https://cloud.google.com/bigquery/docs/reference/storage
